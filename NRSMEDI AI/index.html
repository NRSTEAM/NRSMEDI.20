<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NRS AI </title>
  <link rel="icon" href="image/logo 3.0">
  <style>
    :root{
      --bg: #0b1020;
      --panel: rgba(255,255,255,0.06);       
      --panel-2: rgba(255,255,255,0.12);
      --text: #e9eefb;
      --muted: #9aa4c7;
      --accent: #7c9cff;
      --accent-2:#67e8f9;
      --danger:#ff6b6b;
      --ok:#22c55e;
      --shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
      --radius: 18px;
    }

    *{ box-sizing: border-box }
    html,body{ height:100% }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(1200px 800px at 10% 10%, rgba(124,156,255,.12), transparent 60%),
                  radial-gradient(1200px 800px at 90% 30%, rgba(103,232,249,.15), transparent 55%),
                  var(--bg);
      display:grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: 18px;
    }

    header{
      display:flex; align-items:center; justify-content:space-between;
      backdrop-filter: blur(8px);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 12px 16px;
      box-shadow: var(--shadow);
    }

    .title{
      display:flex; gap:12px; align-items:center; font-weight:700; letter-spacing:.3px
    }
    .title .logo{ width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 18px rgba(124,156,255,.35) }

    .toolbar{ display:flex; gap:8px; align-items:center }
    .btn{ 
      height:38px; padding:0 14px; border-radius: 12px; border:none; cursor:pointer; color:var(--text);
      background: var(--panel-2); box-shadow: var(--shadow); transition: transform .08s ease, background .2s ease, opacity .2s; display:inline-flex; align-items:center; gap:8px; font-weight:600
    }
    .btn:active{ transform: translateY(1px) scale(.99) }
    .btn.primary{ background: linear-gradient(135deg, var(--accent), var(--accent-2)) }
    .btn.ghost{ background: transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12) }

    .chat{
      position:relative;
      overflow:hidden;
      border-radius: var(--radius);
      background: rgba(10,15,35,.45);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      min-height: 0; /* so the flex child can shrink */
    }

    .messages{
      height:100%;
      overflow:auto;
      padding: 16px;
      display:flex; flex-direction:column; gap:12px;
      scroll-behavior:smooth;
    }

    .msg{
      max-width: 78ch;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.06);
      box-shadow: var(--shadow);
      line-height: 1.4;
      animation: pop .15s ease;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user{ align-self:flex-end; background: linear-gradient(135deg, rgba(124,156,255,.22), rgba(103,232,249,.20)); border-top-right-radius: 6px }
    .msg.bot{ align-self:flex-start; border-top-left-radius: 6px }

    .row{
      display:flex; align-items: flex-end; gap:10px; padding: 10px; background: var(--panel); box-shadow: var(--shadow); border-radius: var(--radius);
    }

    .input-wrap{ position:relative; flex:1; }
    textarea{
      width:100%; max-height:200px; min-height:48px; resize:none; padding: 12px 44px 12px 14px;
      border-radius: 14px; border:none; outline:none; color:var(--text);
      background: rgba(255,255,255,.06);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
      font-size: 15px; line-height:1.35;
    }
    textarea::placeholder{ color: var(--muted) }

    .send{ width:44px; height:44px; border-radius: 14px; border:none; cursor:pointer; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display:grid; place-items:center; box-shadow: var(--shadow); transition: transform .08s ease }
    .send:active{ transform: translateY(1px) scale(.98) }

    .icon{ width:18px; height:18px; fill: currentColor }
    .circle{ width:44px; height:44px; border-radius: 14px; display:grid; place-items:center; background: var(--panel-2); border: none; color: var(--text); cursor:pointer; box-shadow: var(--shadow) }

    .typing{
      display:inline-grid; grid-auto-flow:column; gap:5px; align-items:center
    }
    .dot{ width:6px; height:6px; background: var(--muted); border-radius:50%; animation: blink 1.2s infinite }
    .dot:nth-child(2){ animation-delay: .15s }
    .dot:nth-child(3){ animation-delay: .3s }

    .system-bar{ font-size:12px; color: var(--muted); text-align:center; padding:4px 0 }

    @keyframes blink{ 0%, 80%, 100%{ opacity:.2 } 40%{ opacity:1 } }
    @keyframes pop{ from{ transform: scale(.98); opacity:0 } to{ transform: scale(1); opacity:1 } }

    @media (max-width: 640px){
      body{ padding:12px }
      .btn span{ display:none }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <div class="logo" aria-hidden="true">🩺</div>
      <div>
        <div>NRS AI ASSISTANT</div>
        <small style="color:var(--muted)">24/7 ANYTIME-ANYWHERE</small>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn ghost" id="clearBtn" title="Clear conversation">🧹 <span>ALL CLEAR</span></button>
      <button class="btn ghost" id="exportBtn" title="Export conversation">⬇️ <span>DOWNLOAD</span></button>
      <button class="btn ghost" id="themeBtn" title="Toggle theme"> 🎨<span>THEME</span></button>
      <button class="btn ghost" id="DoctorBtn" title="doctor">🏥 <span>APPOINTMENT</span></button>
      <button class="btn ghost" id = "map Btn"title="hospital"> 🗺️<span>LOCATION</span></button>
    </div>
  </header>

  <main class="chat" aria-live="polite">
    <div id="messages" class="messages" role="log" aria-label="Messages"></div>
  </main>

  <footer class="row">
    <button class="circle" id="micBtn" title="Hold to speak / Click to toggle">
      🎤
    </button>

    <div class="input-wrap">
      <textarea id="input" placeholder="Type a message… (Enter to send, Shift+Enter for new line)" rows="1"></textarea>
      <div class="system-bar" id="status"></div>
    </div>

    <button class="send" id="sendBtn" title="Send">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </footer>

<script>
/* ===== Utility ===== */
const $ = (sel, el=document) => el.querySelector(sel);
const messagesEl = $('#messages');
const inputEl = $('#input');
const sendBtn = $('#sendBtn');
const micBtn = $('#micBtn');
const statusEl = $('#status');
const STORAGE_KEY = 'fullpage-chat-history-v1';

function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }
function scrollToBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

/* ===== Message Handling ===== */
function addMessage(text, who='bot'){
  const msg = document.createElement('div');
  msg.className = `msg ${who}`;
  msg.innerHTML = text;
  messagesEl.appendChild(msg);
  persist();
  scrollToBottom();
}

function addTyping(){
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.innerHTML = '<span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';
  messagesEl.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function persist(){
  const items = [...messagesEl.children].map(n=>({
    who: n.classList.contains('user') ? 'user' : 'bot',
    html: n.innerHTML
  }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function restore(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return;
  const items = JSON.parse(raw);
  messagesEl.innerHTML = '';
  items.forEach(it=>{
    const div = document.createElement('div');
    div.className = `msg ${it.who}`;
    div.innerHTML = it.html;
    messagesEl.appendChild(div);
  });
  scrollToBottom();
}

  });

/* ===== Bot Logic ===== */
async function fakeAIResponse(userText){
  await wait(500);
  const lower = userText.toLowerCase().trim();
  if(!lower) return "";

  if(['hi','hello','hey','hai'].includes(lower))
    return "HELLO 👋 WELCOME TO NRS AI ASSISTANT, <br> I CAN PROVIDE ALL MEDICAL INFORMATION YOU NEED SO ASK ANY HELP YOU NEED ✨ ";

  for(const key in medicalKnowledge){
    if(lower.includes(key)) return medicalKnowledge[key];
  }

  const fever = lower.includes('fever');
  const head = lower.includes('headache') || lower.includes('head pain');
  const stomach = lower.includes('stomach pain');

  if(fever && head && stomach)
    return "<b>Fever + Headache + Stomach Pain</b><br>Possible viral or food infection. Consult doctor if severe.";

  if(fever && head)
    return "<b>Fever with Headache</b><br>Rest, fluids, paracetamol.";

  if(fever && stomach)
    return "<b>Fever with Stomach Pain</b><br>ORS and light food advised.";

  if(fever)
    return "<b>Fever detected</b><br>Rest and drink fluids.";

  if(head)
    return "<b>Headache detected</b><br>Avoid screens, drink water.";

  if(stomach)
    return "<b>Stomach pain detected</b><br>Eat light food.";

  return "Please type symptoms like <i>fever, headache, stomach pain</i> or disease name.";
}

/* ===== Send Message ===== */
async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value = '';
  addMessage(text,'user');
  const typing = addTyping();
  const reply = await fakeAIResponse(text);
  typing.remove();
  addMessage(reply,'bot');
}

sendBtn.onclick = sendMessage;
inputEl.onkeydown = e=>{
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
};

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SR){
    const r = new SR();
    r.onresult = e=> inputEl.value = e.results[0][0].transcript;
    micBtn.onclick = ()=> r.start();
  }
}catch(e){}

restore();

    // ===== Voice input =====
    let recognition;
    let listening = false;
    try{
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(SR){
        recognition = new SR();
        recognition.lang = 'en-US';
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onstart = ()=>{ listening = true; statusEl.textContent = 'Listening…'; micBtn.style.background = 'linear-gradient(135deg, rgba(124,156,255,.35), rgba(103,232,249,.35))'; };
        recognition.onerror = ()=>{ statusEl.textContent = 'Mic error. Check permissions.' };
        recognition.onend = ()=>{ listening = false; statusEl.textContent = ''; micBtn.style.background = ''; };

        recognition.onresult = (e)=>{
          let transcript = '';
          for(const res of e.results){ transcript += res[0].transcript; }
          inputEl.value = transcript;
          autoResize();
        };

        micBtn.addEventListener('mousedown', ()=>{ recognition.start(); });
        micBtn.addEventListener('mouseup', ()=>{ if(listening) recognition.stop(); });
        micBtn.addEventListener('click', ()=>{ // toggle on click for mobile
          if(!listening) recognition.start(); else recognition.stop();
        });
      }else{
        micBtn.disabled = true; micBtn.title = 'Speech Recognition not supported';
      }
    }catch(err){ console.warn('Speech setup failed', err); micBtn.disabled = true; }

    // ===== Commands =====
    $('#clearBtn').addEventListener('click', ()=>{

        localStorage.removeItem(STORAGE_KEY);
        messagesEl.innerHTML = '';
        addMessage('NRS AI ✨', 'bot');
      }
    });

    $('#exportBtn').addEventListener('click', ()=>{
      const lines = [...messagesEl.children].map(n=>{
        const who = n.classList.contains('user') ? 'You' : 'Bot';
        const text = n.innerText.replace(/\n+/g, '\n');
        return `[${who}] ${text}`;
      }).join('\n\n');
      const blob = new Blob([lines], {type:'text/plain'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `chat-export-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.txt`;
      a.click(); URL.revokeObjectURL(url);
    });
