<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRSMEDI Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Video Background Container */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        /* Video Styling */
        .video-background video {
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            filter: brightness(0.4);
        }
        
        /* Overlay Effect */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 30, 60, 0.5);
            z-index: -1;
        }
        
        /* Registration Form Container */
        .register-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.8s ease-out;
        }
        
        /* Input Field Styling */
        .form-input {
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
        }
        
        .form-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        
        /* Button Styling */
        .register-btn {
            background: linear-gradient(to right, #2563eb, #1d4ed8);
            transition: all 0.3s ease;
        }
        
        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }
        
        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Responsive Design */
        @media (max-width: 640px) {
            .register-container {
                width: 90%;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Video Background -->
    <div class="video-background">
        <video autoplay muted loop>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-medical-equipment-working-in-a-hospital-34703-large.mp4" type="video/mp4">
            <img src="https://placehold.co/1920x1080?text=Medical+Technology+Background" alt="Modern medical equipment animation">
            Your browser does not support HTML5 video.
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- Registration Form -->
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="register-container w-full max-w-md p-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800 mb-2">Patient Registration</h2>
                <p class="text-gray-600">Join our healthcare network today</p>
            </div>
            
            <form id="registerForm" onsubmit="redirectToLogin(event)">
                <div class="space-y-4">
                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            class="w-full px-4 py-2 form-input rounded-lg" 
                            placeholder="your@email.com"
                            required
                        >
                    </div>
                    
                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="password" 
                                class="w-full px-4 py-2 form-input rounded-lg pr-10" 
                                placeholder="••••••••"
                                required
                            >
                            <button 
                                type="button" 
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-blue-500 focus:outline-none"
                                onclick="togglePassword('password')"
                            >
                                👁️
                            </button>
                        </div>
                    </div>
                    
                    <!-- Additional Fields -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="dob" class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
                            <input 
                                type="date" 
                                id="dob" 
                                class="w-full px-4 py-2 form-input rounded-lg" 
                                required
                            >
                        </div>
                        <div>
                            <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                            <select 
                                id="gender" 
                                class="w-full px-4 py-2 form-input rounded-lg" 
                                required
                            >
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Phone -->
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            class="w-full px-4 py-2 form-input rounded-lg" 
                            placeholder="+917402014864" 
                            pattern="^\+[1-9]\d{1,14}$"
                            required
                        >
                    </div>
                    
                    <!-- Register Button -->
                    <button 
                        type="submit" 
                        class="w-full py-3 register-btn text-white font-medium rounded-lg"
                    >
                        Register
                    </button>
                </div>
                
                <!-- Links -->
                <div class="mt-6 text-center text-sm">
                    <a href="login.html" class="text-blue-600 hover:underline">Already have an account? Sign In</a>
                    <span class="mx-2 text-gray-400">|</span>
                    <a href="forgetpassword.html" class="text-blue-600 hover:underline">Forgot Password?</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            field.type = field.type === "password" ? "text" : "password";
        }
        
        // Form submission handler
        function redirectToLogin(event) {
            event.preventDefault();
            
            // Validate password match
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            
            // Show loading state
            const button = event.target.querySelector('button[type="submit"]');
            button.disabled = true;
            button.innerHTML = 'Registering...';
            
            // Simulate registration process
            setTimeout(() => {
                alert('Registration Successful! Redirecting to login page...');
                window.location.href = 'login.html';
            }, 1500);
        }
    </script>
</body>
</html>
