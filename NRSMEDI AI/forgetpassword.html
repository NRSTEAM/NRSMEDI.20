<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="icon" href="image/LOGO2.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #9e63f7a0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #3f03f3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Forgot Password</h2>
        <p>Enter your email to reset your password</p>
        <input type="email" id="email" placeholder="Enter your email" required>
        <button onclick="resetPassword()">Reset Password</button>
        <p id="message" style="color: green; margin-top: 10px;"></p>
    </div>

    <script>
        function resetPassword() {
            var email = document.getElementById('email').value;
            if (email) {
                document.getElementById('message').innerText = "A password reset link has been sent to " + email;
            } else {
                document.getElementById('message').innerText = "Please enter a valid email";
                document.getElementById('message').style.color = "red";
            }
        }
    </script>
</body>
</html>
