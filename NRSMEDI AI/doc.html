<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Appointment Booking</title>
<link rel="icon" href="image/LOGO2.png">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI",system-ui;
  background:#f3f6fb;
  color:#1f2937;
}
header{
  background:#2563eb;
  color:#fff;
  padding:18px;
  font-size:22px;
  font-weight:700;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:24px;
}
.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 15px 35px rgba(0,0,0,.08);
  margin-bottom:24px;
}
label{
  font-weight:600;
  display:block;
  margin-top:14px;
}
select,input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #d1d5db;
  margin-top:6px;
  font-size:15px;
}
.doctors{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
  margin-top:20px;
}
.doctor{
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:16px;
  text-align:center;
}
.doctor img{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
}
.doctor h4{margin:10px 0 4px}
.doctor p{color:#6b7280;font-size:14px}
button{
  margin-top:14px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}
.hidden{display:none}
.confirm{
  background:#ecfdf5;
  border-left:6px solid #22c55e;
}
footer{
  text-align:center;
  padding:20px;
  color:#6b7280;
}
</style>
</head>

<body>

<header>🩺 Doctor Appointment Booking</header>

<div class="container">

<!-- STEP 1 -->
<div class="card">
  <h3>Patient Details</h3>
  <label>Unique Number</label>
  <input id="uid" placeholder="Example: 24505647">

  <label>Select District (Tamil Nadu)</label>
  <select id="district" onchange="loadHospitals()">
    <option value="">-- Select District --</option>
    <option>Chennai</option>
    <option>Coimbatore</option>
    <option>Madurai</option>
    <option>Salem</option>
    <option>Tiruchirappalli</option>
  </select>

  <label>Select Hospital</label>
  <select id="hospital" onchange="loadDoctors()">
    <option value="">-- Select Hospital --</option>
  </select>
</div>

<!-- STEP 2 -->
<div class="card hidden" id="doctorSection">
  <h3>Select Doctor</h3>
  <div class="doctors" id="doctorList"></div>
</div>

<!-- STEP 3 -->
<div class="card hidden" id="bookingSection">
  <h3>Choose Date & Time</h3>
  <label>Appointment Date</label>
  <input type="date" id="date">

  <label>Appointment Time</label>
  <input type="time" id="time">

  <button onclick="confirmBooking()">Confirm Appointment</button>
</div>

<!-- CONFIRM -->
<div class="card confirm hidden" id="result"></div>

</div>

<footer>
  © 2026 Doctor Appointment System
</footer>

<script>
const DATA = {
  Chennai:{
    "Apollo Hospital":[
      {name:"Dr. SIVA MURUGA K", spec:"Cardiologist"},
      {name:"Dr. NARENDRA PRASATH R", spec:"Dermatologist"}
    ]
  },
  Coimbatore:{
    "KMCH Hospital":[
      {name:"Dr. NITHIS KUMAR S", spec:"CRADIOLOGIST"},
      {name:"Dr. RATHEESH NS", spec:"SKIN"}
    ]
  },
  Madurai:{
    "Meenakshi Mission":[
      {name:"Dr. Balamurugan", spec:"Neurologist"}
    ]
  },
  Salem:{
    "SKS Hospital":[
      {name:"Dr. Prakash", spec:"General Physician"}
    ]
  },
  Tiruchirappalli:{
    "KMC Hospital":[
      {name:"Dr. Joseph", spec:"Cardiologist"}
    ]
  }
};

let selectedDoctor = "";

function loadHospitals(){
  hospital.innerHTML='<option value="">-- Select Hospital --</option>';
  doctorSection.classList.add("hidden");
  bookingSection.classList.add("hidden");

  if(!district.value) return;

  Object.keys(DATA[district.value]).forEach(h=>{
    hospital.innerHTML += `<option>${h}</option>`;
  });
}

function loadDoctors(){
  doctorList.innerHTML="";
  bookingSection.classList.add("hidden");

  if(!hospital.value) return;

  DATA[district.value][hospital.value].forEach(d=>{
    doctorList.innerHTML += `
      <div class="doctor">
        <img src="https://www.shutterstock.com/image-vector/male-doctor-glasses-pensive-pose-600nw-2557336587.jpg">
        <h4>${d.name}</h4>
        <p>${d.spec}</p>
        <button onclick="selectDoctor('${d.name}')">Select</button>
      </div>`;
  });

  doctorSection.classList.remove("hidden");
}

function selectDoctor(name){
  selectedDoctor = name;
  bookingSection.classList.remove("hidden");
}

function confirmBooking(){
  if(!uid.value || !date.value || !time.value){
    alert("Please fill all details");
    return;
  }

  const booking = {
    uid:uid.value,
    district:district.value,
    hospital:hospital.value,
    doctor:selectedDoctor,
    date:date.value,
    time:time.value
  };

  const list = JSON.parse(localStorage.getItem("doctorBookings")||"[]");
  list.push(booking);
  localStorage.setItem("doctorBookings",JSON.stringify(list));

  result.classList.remove("hidden");
  result.innerHTML = `
    <h3>✅ Appointment Confirmed</h3>
    <p><b>Doctor:</b> ${booking.doctor}</p>
    <p><b>Hospital:</b> ${booking.hospital}</p>
    <p><b>District:</b> ${booking.district}</p>
    <p><b>Date:</b> ${booking.date}</p>
    <p><b>Time:</b> ${booking.time}</p>
  `;
}
</script>

</body>
</html>
